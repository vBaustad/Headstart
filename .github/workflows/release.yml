# Push a version tag (git tag v0.8.1 && git push origin v0.8.1) and this builds the zip with the
# BigWigs packager, uploads it to CurseForge and attaches it to a GitHub release.
# Needs the repository secret CF_API_KEY (a CurseForge API token).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
